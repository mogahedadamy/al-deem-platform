emailVerificationBodyHtml=<div dir="rtl" style="font-family:Tahoma,Arial,sans-serif;line-height:1.8;color:#17352f"><h2 style="color:#087f6a">مرحباً بك في مركز العميد للتدريب</h2><p>مرحباً {2}،</p><p>يرجى تأكيد بريدك الإلكتروني للبدء في استخدام حسابك.</p><p><a href="{0}" style="display:inline-block;background:#087f6a;color:#fff;padding:11px 22px;border-radius:8px;text-decoration:none">تأكيد البريد الإلكتروني</a></p><p style="color:#61736f;font-size:13px">تنتهي صلاحية الرابط خلال {3}. إذا لم تنشئ هذا الحساب، يمكنك تجاهل الرسالة.</p></div>
