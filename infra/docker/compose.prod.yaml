# Production override. Run with:
# docker compose -f compose.yaml -f compose.prod.yaml --env-file .env.production up -d
# Do not store .env.production in Git.
services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DEEM_POSTGRES_PASSWORD:?set DEEM_POSTGRES_PASSWORD}

  redis:
    restart: unless-stopped

  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.71.6
    restart: unless-stopped
    command: ["start-from-init", "--masterkeyFromEnv"]
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?set a 32-character ZITADEL_MASTERKEY}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${DEEM_POSTGRES_PASSWORD:?set DEEM_POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${DEEM_POSTGRES_PASSWORD:?set DEEM_POSTGRES_PASSWORD}
      ZITADEL_EXTERNALDOMAIN: auth.alameedtraining.com
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?set ZITADEL_ADMIN_PASSWORD}

  # Mailpit is useful only for local testing. Production must use an SMTP provider.
  mailpit:
    profiles: ["development"]
