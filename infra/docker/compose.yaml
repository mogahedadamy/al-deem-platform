services:
  postgres:
    image: postgres:17-alpine
    container_name: deem-postgres
    environment:
      POSTGRES_USER: deem
      POSTGRES_PASSWORD: deem
      POSTGRES_DB: deem
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - deem_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deem -d deem"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: deem-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6391:6379"
    volumes:
      - deem_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.71.6
    container_name: alameed-zitadel
    command: ["start-from-init", "--masterkeyFromEnv"]
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?set a 32-character ZITADEL_MASTERKEY}
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: deem
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: deem
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: deem
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: deem
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8091
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_NAME: "مركز العميد للتدريب"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME:-admin@alameedtraining.com}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?set ZITADEL_ADMIN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "true"
    ports:
      - "127.0.0.1:8091:8080"
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    container_name: deem-mailpit
    ports:
      - "127.0.0.1:8092:8025"   # Web UI
      - "127.0.0.1:8093:1025"   # SMTP
    environment:
      MP_SMTP_BIND: 0.0.0.0:1025

volumes:
  deem_pgdata:
  deem_redisdata:
