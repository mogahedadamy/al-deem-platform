name: Platform CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: services/core-api/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - name: Go vet and tests
        working-directory: services/core-api
        run: |
          go vet ./...
          go test ./... -count=1 -cover
      - name: Validate generated API contract
        run: |
          cp packages/api-client/src/schema.d.ts /tmp/schema.before.d.ts
          pnpm --filter @al-deem/api-client gen:ts
          diff -u /tmp/schema.before.d.ts packages/api-client/src/schema.d.ts

  public-e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/public.spec.ts --project=desktop
        env:
          E2E_BASE_URL: https://alameedtraining.com
